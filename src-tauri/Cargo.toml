[package]
name = "mc-erp"
version = "1.0.0"
description = "Metrocosmo ERP Native Desktop Application"
authors = ["Metrocosmo Ltd <info@metrocosmo.com>"]
license = "Proprietary"
repository = "https://github.com/Corel41/MC_ERP"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mc_erp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
